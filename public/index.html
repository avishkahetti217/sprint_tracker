<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sprint Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Sprint Tracker</h1>
    <div class="header-right">
      <nav>
        <button id="tab-today" class="tab active" data-tab="today">Today</button>
        <button id="tab-sprints" class="tab" data-tab="sprints">Sprints</button>
        <button id="tab-stats" class="tab" data-tab="stats">Statistics</button>
        <button id="tab-notes" class="tab" data-tab="notes">Notes</button>
      </nav>
      <button id="theme-toggle" class="theme-toggle" type="button" title="Toggle dark mode">🌙</button>
    </div>
  </header>

  <main>
    <section id="view-today" class="view active">
      <div class="day-header">
        <input type="date" id="date-picker" />
        <div id="sprint-badge" class="sprint-badge"></div>
        <div id="day-total" class="day-total"></div>
      </div>

      <div class="goals-panel">
        <h3>Goals for the day <span id="goals-complete-badge" class="goals-complete-badge" hidden>😊</span></h3>
        <ul id="goals-list" class="goals-list"></ul>
        <form id="add-goal-form" class="add-goal-form">
          <input type="text" id="goal-text" placeholder="Add a goal (max 3)" />
          <button type="submit">Add goal</button>
        </form>
      </div>

      <div class="calendar-panel">
        <div class="calendar-panel-header">
          <h3>Today's Meetings</h3>
          <button id="refresh-calendar-btn" class="calendar-refresh-btn" type="button" title="Refresh now">↻</button>
        </div>
        <ul id="calendar-events-list" class="calendar-events-list"></ul>
        <div id="calendar-updated" class="calendar-updated"></div>
      </div>

      <ul id="task-list" class="task-list"></ul>

      <form id="add-task-form" class="add-task-form">
        <input type="text" id="task-description" placeholder="What are you working on?" required />
        <select id="task-category" class="task-category-select"></select>
        <input type="text" id="task-comment" placeholder="Comment (optional)" />
        <button type="submit">Add task</button>
      </form>
    </section>

    <section id="view-sprints" class="view">
      <div class="sprint-toolbar">
        <span id="export-hint">Select sprints below to export</span>
        <button id="export-csv-btn" disabled>Download CSV</button>
      </div>
      <div id="sprint-list"></div>
    </section>

    <section id="view-stats" class="view">
      <div class="stats-toolbar">
        <label>From <input type="date" id="stats-start" /></label>
        <label>To <input type="date" id="stats-end" /></label>
        <div class="stats-presets">
          <button type="button" data-preset="sprint">This Sprint</button>
          <button type="button" data-preset="lastSprint">Last Sprint</button>
          <button type="button" data-preset="7">Last 7 Days</button>
          <button type="button" data-preset="30">Last 30 Days</button>
        </div>
      </div>

      <div class="stats-summary" id="stats-summary"></div>

      <h3 class="stats-section-title">Time by category</h3>
      <div id="stats-categories" class="stats-categories"></div>
    </section>

    <section id="view-notes" class="view">
      <div class="notes-toolbar">
        <label>Month <input type="month" id="notes-month" /></label>
      </div>

      <form id="add-note-form" class="add-note-form">
        <input type="date" id="note-date" required />
        <select id="note-category"></select>
        <textarea id="note-text" placeholder="What happened?" required></textarea>
        <button type="submit">Add note</button>
      </form>

      <div id="notes-groups"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
